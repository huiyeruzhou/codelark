schema_version = 2

[session]
workspace = "~"
tmux_session_name = ""
tmux_capture_lines = 10
tmux_auto_enter = true
tmux_echo_input = true

[runtime]
agent = "codex"

[bridge]
default_workspace = "~"
ui_allow_lan = false
ui_access_token = ""

[runtime.codex]
model = ""
yolo_mode = "off"
provider = "tmux"
skip_git_repo_check = true
sandbox_mode = "workspace-write"
network_access = true
reasoning_effort = "medium"

[runtime.claude]
model = ""
yolo_mode = "off"
provider = "tmux"
executable = "claude"
reasoning_effort = "medium"
idle_timeout_minutes = 0

[[channels]]
id = "feishu-default"
alias = "飞书"
provider = "feishu"
enabled = false

[channels.config]
history_message_limit = 8
stream_status_idle_start_seconds = 180
stream_status_check_interval_seconds = 10
app_id = ""
app_secret = ""
site = "feishu"
allowed_users = []
streaming_enabled = true
feedback_markdown_enabled = true
require_mention = false
group_authorized = false
