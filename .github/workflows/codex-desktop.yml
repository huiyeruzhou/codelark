name: Codex Desktop sharing

on:
  workflow_dispatch:
  push:
    branches: [ci/codex-desktop-remote]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths:
      - src/runtime/codex/app-server-*.ts
      - src/runtime/codex/desktop-remote.ts
      - src/__tests__/unit/runtime/codex/app-server-*.test.ts
      - src/bridge/permission/app-server*.ts
      - src/bridge/session/command-use-cases/*.ts
      - src/__tests__/workflow/bridge/session/*.test.ts
      - src/__tests__/workflow/bridge/permission/app-server.test.ts
      - src/__tests__/workflow/runtime/codex/app-server-default.test.ts
      - scripts/verify-codex-desktop-macos.ts
      - scripts/verify-codex-app-server-lifecycle.ts
      - scripts/verify-codex-default-app-server.ts
      - scripts/verify-codex-local-bootstrap.ts
      - src/runtime/codex/thread-bootstrap.ts
      - scripts/fixtures/codex-app-server-*
      - scripts/fixtures/codex-tmux-app-server.ts
      - src/runtime/codex/tmux-provider.ts
      - src/runtime/codex/tui-runtime-signals.ts
      - src/runtime/codex/session-index/**
      - src/bridge/tmux/runtime.ts
      - src/__tests__/e2e/local-process/codex/real-codex-tmux-provider.e2e.test.ts
      - scripts/fixtures/desktop-gui*.ts
      - .github/workflows/codex-desktop.yml

permissions:
  contents: read

jobs:
  protocol:
    name: 协议生命周期 · Codex ${{ matrix.codex }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        codex: ['0.145.0', '0.153.4', '0.160.0', '0.163.0', '0.165.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@${{ matrix.codex }}
      - name: Install tmux for current CLI compatibility
        if: matrix.codex == '0.163.0' || matrix.codex == '0.165.0'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: 检查验收代码
        run: |
          npx tsc --noEmit --strict --module Node16 --moduleResolution Node16 --target ES2023 --esModuleInterop --skipLibCheck --resolveJsonModule scripts/verify-codex-app-server-lifecycle.ts scripts/verify-codex-default-app-server.ts scripts/verify-codex-local-bootstrap.ts scripts/verify-codex-desktop-macos.ts scripts/fixtures/codex-app-server-provider-client.ts
      - name: 验证本地 bootstrap 不调用自定义模型服务
        if: matrix.codex == '0.153.4' || matrix.codex == '0.163.0' || matrix.codex == '0.165.0'
        run: >-
          node --import tsx scripts/verify-codex-local-bootstrap.ts
          --cli "$(command -v codex)"
          --evidence '${{ runner.temp }}/codex-protocol-evidence/local-bootstrap'
      - name: 真实 CLI + 隔离 mock 模型验证 lifecycle
        run: >-
          node --import tsx scripts/verify-codex-app-server-lifecycle.ts
          --cli "$(command -v codex)"
          --expect-version '${{ matrix.codex }}'
          --evidence '${{ runner.temp }}/codex-protocol-evidence'
      - name: 真实 CLI 验证默认后端与退出后恢复
        run: >-
          node --import tsx scripts/verify-codex-default-app-server.ts
          --cli "$(command -v codex)"
          --evidence '${{ runner.temp }}/codex-protocol-evidence/default-backend'
      - name: 验证 remote tmux 同轮 steer 与关闭后 stop
        if: matrix.codex == '0.163.0'
        run: >-
          node --import tsx scripts/verify-codex-default-app-server.ts
          --cli "$(command -v codex)" --tmux-view
          --evidence '${{ runner.temp }}/codex-protocol-evidence/remote-view'
      - name: 验证当前 CLI 的 legacy tmux 交互
        if: matrix.codex == '0.163.0'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-tmux"
          env -u TMUX -u TMUX_PANE TMUX_TMPDIR="$RUNNER_TEMP/codex-tmux" \
            CODELARK_REAL_CODEX_E2E_EXECUTABLE="$(command -v codex)" \
            node --import tsx --test src/__tests__/e2e/local-process/codex/real-codex-tmux-provider.e2e.test.ts
      - name: 保存原生协议证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-protocol-${{ matrix.codex }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/codex-protocol-evidence
  macos:
    name: macOS · 官方 Desktop GUI + launchd
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@0.163.0
      - name: Typecheck and test connection management
        run: |
          npm run typecheck
          npx tsc --noEmit --strict --module Node16 --moduleResolution Node16 --target ES2023 --esModuleInterop --skipLibCheck --resolveJsonModule scripts/verify-codex-desktop-macos.ts
          node --import tsx --test src/__tests__/unit/runtime/codex/app-server-*.test.ts src/__tests__/unit/runtime/codex/desktop*.test.ts src/__tests__/workflow/bridge/session/session-configuration-inheritance.test.ts src/__tests__/workflow/bridge/session/app-server-clear.test.ts src/__tests__/workflow/bridge/permission/app-server.test.ts src/__tests__/unit/bridge/turn/interactive-turn-final-response-plan.test.ts src/__tests__/unit/bridge/turn/interactive-turn-sdk-conversation-engine.test.ts
          node --import tsx --test scripts/fixtures/desktop-gui-cdp.test.ts
      - name: Install official Desktop in this disposable runner
        shell: bash
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/Codex.dmg"
          mount="$RUNNER_TEMP/codex-desktop-image"
          curl --fail --location --retry 3 https://persistent.oaistatic.com/codex-app-prod/Codex.dmg --output "$dmg"
          shasum -a 256 "$dmg"
          mkdir -p "$mount" "$HOME/Applications"
          hdiutil attach -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          installed=0
          for app in "$mount"/*.app; do
            if test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = com.openai.codex; then
              ditto "$app" "$HOME/Applications/Codex.app"
              installed=1
              break
            fi
          done
          test "$installed" = 1
      - name: 操作官方 Desktop 窗口并验证共享线程、审批和问答
        timeout-minutes: 12
        env:
          CODELARK_DESKTOP_CI: '1'
          CODELARK_DESKTOP_CI_EVIDENCE: /tmp/codelark-desktop-gui-acceptance
        run: node --import tsx scripts/verify-codex-desktop-macos.ts
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-desktop-macos
          if-no-files-found: warn
          path: /tmp/codelark-desktop-gui-acceptance
