name: Real Feishu app-server E2E

on:
  workflow_dispatch:

permissions:
  contents: read

# One test App has one active Bridge. Feishu does not broadcast events to clients.
concurrency:
  group: real-feishu-test-app
  cancel-in-progress: false

jobs:
  feishu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CODELARK_REAL_FEISHU_E2E: '1'
    steps:
      - name: Set isolated authorization paths
        run: |
          echo "CODELARK_REAL_FEISHU_AUTH_HOME=$RUNNER_TEMP/feishu-auth" >> "$GITHUB_ENV"
          echo "CODELARK_REAL_FEISHU_TEST_LARK_CLI_CONFIG_DIR=$RUNNER_TEMP/feishu-auth/.lark-cli" >> "$GITHUB_ENV"
          echo "CODELARK_REAL_FEISHU_TEST_LARK_CLI_XDG_DATA_HOME=$RUNNER_TEMP/feishu-auth/.local/share" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm install --global @openai/codex@0.160.0
      - name: Restore the authorized test account
        id: auth-restore
        env:
          FEISHU_E2E_LARK_AUTH_B64: ${{ secrets.FEISHU_E2E_LARK_AUTH_B64 }}
          CODELARK_REAL_FEISHU_TEST_APP_ID: ${{ secrets.FEISHU_E2E_APP_ID }}
          CODELARK_REAL_FEISHU_TEST_APP_SECRET: ${{ secrets.FEISHU_E2E_APP_SECRET }}
        run: |
          python3 scripts/ci/feishu-auth.py restore \
            --home "$CODELARK_REAL_FEISHU_AUTH_HOME" \
            --app-id "$CODELARK_REAL_FEISHU_TEST_APP_ID"
          python3 - <<'PYENV'
          import json, os, pathlib
          required = ['CODELARK_REAL_FEISHU_TEST_APP_ID', 'CODELARK_REAL_FEISHU_TEST_APP_SECRET']
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Missing test App credentials; no real Feishu test has run.')
          target = pathlib.Path(os.environ['CODELARK_REAL_FEISHU_AUTH_HOME']) / 'test.env'
          target.write_text('\n'.join(key + '=' + json.dumps(os.environ[key]) for key in required) + '\n')
          target.chmod(0o600)
          PYENV
      - name: Restore the latest encrypted refresh state
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.auth-restore.outputs.token-file }}
          key: feishu-user-${{ steps.auth-restore.outputs.cache-generation }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            feishu-user-${{ steps.auth-restore.outputs.cache-generation }}-
      - name: Verify the restored test identity
        id: auth-check
        env:
          CODELARK_REAL_FEISHU_TEST_APP_ID: ${{ secrets.FEISHU_E2E_APP_ID }}
        run: |
          python3 scripts/ci/feishu-auth.py verify \
            --home "$CODELARK_REAL_FEISHU_AUTH_HOME" \
            --app-id "$CODELARK_REAL_FEISHU_TEST_APP_ID"
      - name: Real Feishu input, app-server execution and user-side message readback
        run: |
          mkdir -p "$RUNNER_TEMP/feishu-evidence"
          for provider in sdk tmux; do
            node --import tsx scripts/real-feishu-e2e.ts \
              --test-env-file "$CODELARK_REAL_FEISHU_AUTH_HOME/test.env" \
              --launch-bridge --codex-app-server --runtime codex --provider "$provider" \
              --scenario runtime-message --run-id "ci-${GITHUB_RUN_ID}-${provider}" \
              --run-root "$RUNNER_TEMP/feishu-${provider}" \
              --output "$RUNNER_TEMP/feishu-evidence/${provider}.json"
          done
      # Only the encrypted user token file is cached. Its master key stays in Secrets.
      # Persist refresh-token rotation even when a later test fails.
      - name: Save the refreshed encrypted authorization
        if: always() && steps.auth-check.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.auth-restore.outputs.token-file }}
          key: feishu-user-${{ steps.auth-restore.outputs.cache-generation }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload only test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-feishu-app-server-results
          path: ${{ runner.temp }}/feishu-evidence/*.json
          if-no-files-found: warn
      - name: Remove this runner's test authorization
        if: always()
        run: rm -rf "$CODELARK_REAL_FEISHU_AUTH_HOME"
